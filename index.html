<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดการ COA อัจฉริยะ - PGI Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE; --paper:#FFFFFF; --ink:#1B2A2E; --ink-soft:#5B6B6C;
  --teal:#2F6F6B; --teal-deep:#1F4B49; --amber:#C9862E; --danger:#B23A34; --ok:#3A7D5C;
  --line:#DCD8CC; --line-soft:#EAE7DC;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Angsana New', 'Sarabun', 'TH Sarabun New', sans-serif;
  font-size:16px;
  line-height:1.25;
  min-height:100vh;
}
.mono{font-family:'Angsana New', 'Sarabun', monospace;}
.shell{display:flex;min-height:100vh;}
nav.side{width:250px;flex:none;background:var(--teal-deep);color:#EAF3F1;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
nav.side .brand{font-weight:700;font-size:18px;margin-bottom:2px;}
nav.side .brand small{display:block;font-weight:400;font-size:13px;color:#A9C7C3;margin-top:2px;}
nav.side ul{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:3px;}
nav.side button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:15px;color:#CFE3E0;width:100%;box-sizing:border-box;}
nav.side button:hover{background:rgba(255,255,255,.08);}
nav.side button.active{background:#EAF3F1;color:var(--teal-deep);font-weight:700;}
main{flex:1;padding:20px 28px;max-width:1280px;}
h1.page{font-size:24px;margin:0 0 4px;font-weight:700;}
p.sub{margin:0 0 18px;color:var(--ink-soft);font-size:15px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.card h3{margin:0 0 10px;font-size:17px;font-weight:700;}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px;}
.stat .n{font-size:28px;font-weight:700;line-height:1.1;}
.stat .l{font-size:14px;color:var(--ink-soft);margin-top:2px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;margin-bottom:12px;}
.form-grid label{font-size:14px;color:var(--ink-soft);display:block;margin-bottom:2px;font-weight:600;}
.form-grid input, .form-grid select{width:100%;font-family:inherit;font-size:15px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
button.btn{font-family:inherit;font-size:15px;padding:6px 14px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
button.primary:hover{background:var(--teal-deep);}
button.small{padding:3px 8px;font-size:14px;border-radius:5px;}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
table{width:100%;border-collapse:collapse;font-size:15px;}
th{text-align:center;color:var(--ink-soft);font-weight:700;font-size:14px;padding:6px 4px;border-bottom:1px solid var(--line);background:var(--line-soft);}
td{padding:5px 4px;border-bottom:1px solid var(--line-soft);text-align:center;}
td input, td select{font-family:inherit;font-size:14px;padding:4px 5px;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box;text-align:center;}
.summary-bar{background:var(--line-soft);padding:8px 14px;border-radius:8px;font-size:15px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:15px;}

/* รูปแบบเอกสารสั่งพิมพ์ฟอนต์ Angsana New */
#printArea{display:none;}
.print-container{
  font-family:'Angsana New', 'Sarabun', 'TH Sarabun New', sans-serif !important;
  max-width:760px;
  margin:0 auto;
  padding:20px;
  color:#000;
  line-height:1.2;
}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">COA MANAGEMENT<small>PGI Foods International</small></div>
    <ul id="navlist">
      <li><button type="button" data-tab="dash" class="active">📊 แดชบอร์ด</button></li>
      <li><button type="button" data-tab="qc-analysis">🔬 การวิเคราะห์คุณภาพ (FM-QA-24/19)</button></li>
      <li><button type="button" data-tab="list">📋 รายการ COA ทั้งหมด</button></li>
    </ul>
  </nav>
  <main>
    <section id="tab-dash"></section>
    <section id="tab-qc-analysis" style="display:none"></section>
    <section id="tab-list" style="display:none"></section>
  </main>
</div>
<div id="printArea"></div>

<script>
let activeTab = 'dash';

let currentBatches = [
  { batchNo: '1', amount: 40, time: '09:00', moisture: 0.04, partThrough: 98.5, partRet: 1.5, sieveCheck: 'ผ่าน', w1: 25.08, w2: 25.08, w3: 25.06, w4: 25.08, w5: 25.08, packCheck: 'ผ่าน', labelCheck: 'ผ่าน', threadCheck: 'ผ่าน' },
  { batchNo: '2', amount: 40, time: '10:30', moisture: 0.03, partThrough: 98.8, partRet: 1.2, sieveCheck: 'ผ่าน', w1: 25.06, w2: 25.08, w3: 25.08, w4: 25.06, w5: 25.08, packCheck: 'ผ่าน', labelCheck: 'ผ่าน', threadCheck: 'ผ่าน' },
  { batchNo: '3', amount: 40, time: '12:00', moisture: 0.04, partThrough: 98.4, partRet: 1.6, sieveCheck: 'ผ่าน', w1: 25.08, w2: 25.06, w3: 25.08, w4: 25.08, w5: 25.08, packCheck: 'ผ่าน', labelCheck: 'ผ่าน', threadCheck: 'ผ่าน' }
];

function getQCData(){
  try{
    const r = localStorage.getItem('pgi_qc_data_v5');
    if(r) return JSON.parse(r);
  }catch(e){}
  return [];
}

function saveQCData(data){
  try{
    localStorage.setItem('pgi_qc_data_v5', JSON.stringify(data));
  }catch(e){}
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('nav.side button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  document.querySelectorAll('main > section').forEach(function(s){
    s.style.display = 'none';
  });
  const target = document.getElementById('tab-' + tab);
  if(target){
    target.style.display = 'block';
  }
  render();
}

document.getElementById('navlist').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-tab]');
  if(btn){
    e.preventDefault();
    switchTab(btn.getAttribute('data-tab'));
  }
});

function render(){
  if(activeTab === 'dash') renderDash();
  if(activeTab === 'qc-analysis') renderQCAnalysis();
  if(activeTab === 'list') renderList();
}

function renderDash(){
  const list = getQCData();
  document.getElementById('tab-dash').innerHTML = `
    <h1 class="page">📊 ภาพรวมระบบจัดการ COA &amp; คุณภาพ</h1>
    <p class="sub">สรุปสถานะการตรวจวิเคราะห์คุณภาพผลิตภัณฑ์และการออกเอกสาร COA</p>
    <div class="grid-stats">
      <div class="stat"><div class="n">${list.length}</div><div class="l">รายการ Lot ที่วิเคราะห์</div></div>
      <div class="stat"><div class="n">${list.length}</div><div class="l">COA สำเร็จรูป (FM-QA-25)</div></div>
    </div>
    <div class="card">
      <h3>การบันทึกผลวิเคราะห์คุณภาพและการตรวจสอบบรรจุภัณฑ์</h3>
      <p style="font-size:15px;color:var(--ink-soft)">บันทึกข้อมูลผลแล็บตาม FM-QA-24 และตรวจสอบบรรจุภัณฑ์ตาม FM-QA-19 พร้อมสั่งพิมพ์ COA</p>
      <button type="button" class="btn primary" onclick="switchTab('qc-analysis')">🔬 บันทึกการวิเคราะห์คุณภาพ →</button>
    </div>
  `;
}

function renderQCAnalysis(){
  document.getElementById('tab-qc-analysis').innerHTML = `
    <h1 class="page">🔬 บันทึกการวิเคราะห์คุณภาพ &amp; ตรวจการบรรจุ (FM-QA-24 / FM-QA-19)</h1>
    <p class="sub">บันทึกผลวิเคราะห์ Particle size, ความชื้น, คุณภาพแล็บ และการตรวจสอบบรรจุภัณฑ์ทุก Batch เพื่อออก COA (FM-QA-25)</p>

    <!-- 1. ข้อมูลการสั่งผลิตและวัตถุดิบ -->
    <div class="card">
      <h3 style="color:var(--teal)">1. ข้อมูลทั่วไปและการสั่งผลิต</h3>
      <div class="form-grid">
        <div><label>ชนิดผลิตภัณฑ์</label>
          <select id="qc-prod">
            <option value="Icing Sugar">Icing Sugar</option>
            <option value="Sugar Milled 40s">Sugar Milled 40s</option>
            <option value="Caster Sugar 30s">Caster Sugar 30s</option>
            <option value="Ground Sugar">Ground Sugar</option>
          </select>
        </div>
        <div><label>Lot No. ผลิตภัณฑ์</label><input id="qc-lot" placeholder="เช่น IC260801"></div>
        <div><label>ชื่อลูกค้า (Customer)</label><input id="qc-cust" placeholder="ระบุชื่อลูกค้า"></div>
        <div><label>วันที่ผลิต (MFG Date)</label><input id="qc-mfg" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div><label>วันที่หมดอายุ (EXP Date)</label><input id="qc-exp" type="date"></div>
        <div><label>กำหนดส่งมอบ (Delivery Date)</label><input id="qc-deliv" type="date"></div>
      </div>
      <div class="form-grid">
        <div><label>Polarization วัตถุดิบ (°Z)</label><input id="qc-raw-polar" type="number" step="0.01" value="99.80"></div>
        <div><label>Color วัตถุดิบ (ICUMSA)</label><input id="qc-raw-color" type="number" value="45"></div>
        <div><label>Invert Sugar วัตถุดิบ (% w/w)</label><input id="qc-raw-invert" type="number" step="0.001" value="0.020"></div>
      </div>
    </div>

    <!-- 2. ข้อมูลบรรจุภัณฑ์ (FM-QA-19) -->
    <div class="card">
      <h3 style="color:var(--teal)">2. ข้อมูลบรรจุภัณฑ์และเกณฑ์น้ำหนัก (FM-QA-19 Rev.02)</h3>
      <div class="form-grid">
        <div><label>ชนิดบรรจุภัณฑ์ชั้นใน</label><input id="pkg-inner" value="HDPE Bag / LDPE liner"></div>
        <div><label>ชนิดบรรจุภัณฑ์ชั้นนอก</label><input id="pkg-outer" value="PP Woven bag (ถุงกระสอบเย็บด้าย)"></div>
        <div><label>สีด้ายเย็บ (Thread Color)</label><input id="pkg-thread-color" value="สีขาว / สีชมพู"></div>
        <div><label>ขนาดบรรจุสุทธิต่อถุง (Net Wt. Kg)</label><input id="pkg-net-spec" type="number" step="0.01" value="25.00"></div>
        <div><label>เกณฑ์น้ำหนักรวมถุงชั้นใน (Gross Wt. Spec)</label><input id="pkg-gross-spec" value="25.08 Kg (25.00 - 25.15 Kg)"></div>
        <div><label>หมายเลขเครื่องชั่ง</label><input id="pkg-scale-id" value="SCL-QA-01"></div>
      </div>
    </div>

    <!-- 3. ตาราง Batch บันทึกผลแล็บ FM-QA-24 และการตรวจบรรจุภัณฑ์ FM-QA-19 -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
        <h3 style="color:var(--teal);margin:0">3. รายการวิเคราะห์คุณภาพ &amp; การบรรจุทุก Batch (FM-QA-24 &amp; FM-QA-19)</h3>
        <button type="button" class="btn small primary" id="btn-add-batch">+ เพิ่ม Batch</button>
      </div>

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th rowspan="2" style="width:60px">Batch</th>
              <th rowspan="2" style="width:70px">จำนวน<br>(ถุง)</th>
              <th rowspan="2" style="width:65px">เวลา</th>
              <th colspan="3">FM-QA-24: คุณภาพ &amp; Particle Size</th>
              <th colspan="4">FM-QA-19: การสุ่มชั่งน้ำหนักรวมถุงชั้นใน &amp; สภาพบรรจุภัณฑ์</th>
              <th rowspan="2" style="width:50px">จัดการ</th>
            </tr>
            <tr>
              <th style="width:75px">Moisture<br>(%)</th>
              <th style="width:85px">ผ่าน 180µ<br>(%)</th>
              <th style="width:85px">ค้าง 180µ<br>(%)</th>
              <th style="width:140px">สุ่มชั่ง #1-#3 (Kg)</th>
              <th style="width:100px">สุ่มชั่ง #4-#5 (Kg)</th>
              <th style="width:75px">สภาพถุง</th>
              <th style="width:75px">ฉลาก/ด้าย</th>
            </tr>
          </thead>
          <tbody id="batch-rows"></tbody>
        </table>
      </div>

      <div class="summary-bar" id="batch-summary">
        <div><b>รวมผลิตได้:</b> <span id="sum-bags">0</span> ถุง (<span id="sum-mt">0.000</span> MT)</div>
        <div><b>Moisture เฉลี่ย:</b> <span id="avg-moisture">0.00</span> %</div>
        <div><b>ผ่าน 180µ เฉลี่ย:</b> <span id="avg-through">0.00</span> %</div>
        <div><b>ค้าง 180µ เฉลี่ย:</b> <span id="avg-ret">0.00</span> %</div>
        <div><b>นน. รวมถุงชั้นในเฉลี่ย:</b> <span id="avg-gross">0.00</span> Kg</div>
      </div>
    </div>

    <!-- 4. ผลการตรวจทางกายภาพและผู้ลงนาม -->
    <div class="card">
      <h3 style="color:var(--teal)">4. ผลตรวจทางกายภาพ (Physical) และผู้ลงนาม</h3>
      <div class="form-grid">
        <div><label>ลักษณะปรากฏ (Appearance)</label><input id="qa-app" value="White Powder"></div>
        <div><label>กลิ่น (Odor)</label><input id="qa-odor" value="No off odor"></div>
        <div><label>รสชาติ (Taste)</label><input id="qa-taste" value="Sweet"></div>
      </div>
      <div class="form-grid">
        <div><label>ผู้วิเคราะห์ (Report By)</label><input id="qa-rep" placeholder="เจ้าหน้าที่ QA"></div>
        <div><label>ผู้ทวนสอบ (Approved By)</label><input id="qa-appr" placeholder="หัวหน้าฝ่าย QA"></div>
      </div>
      <div style="text-align:right;margin-top:14px;">
        <button type="button" class="btn primary" id="btn-save-qc">💾 บันทึกทุกล็อต &amp; ออกใบ COA (FM-QA-25) →</button>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead>
          <tr>
            <th>Lot No.</th><th>สินค้า</th><th>ลูกค้า</th><th>วันที่ผลิต</th><th>จำนวน Batch</th><th>ยอดรวมผลิต</th><th>การจัดการ</th>
          </tr>
        </thead>
        <tbody id="qc-table-body"></tbody>
      </table>
    </div>
  `;

  renderBatchTable();

  document.getElementById('btn-add-batch').addEventListener('click', function(){
    const nextNo = String(currentBatches.length + 1);
    currentBatches.push({
      batchNo: nextNo,
      amount: 40,
      time: '13:30',
      moisture: 0.04,
      partThrough: 98.5,
      partRet: 1.5,
      sieveCheck: 'ผ่าน',
      w1: 25.08, w2: 25.08, w3: 25.06, w4: 25.08, w5: 25.08,
      packCheck: 'ผ่าน',
      labelCheck: 'ผ่าน',
      threadCheck: 'ผ่าน'
    });
    renderBatchTable();
  });

  document.getElementById('btn-save-qc').addEventListener('click', saveRecord);
  renderQCTable();
}

function renderBatchTable(){
  const tbody = document.getElementById('batch-rows');
  if(!tbody) return;

  tbody.innerHTML = currentBatches.map(function(b, idx){
    return `
      <tr>
        <td><input type="text" value="${b.batchNo}" onchange="updateBatchField(${idx}, 'batchNo', this.value)"></td>
        <td><input type="number" value="${b.amount}" onchange="updateBatchField(${idx}, 'amount', parseFloat(this.value)||0)"></td>
        <td><input type="text" value="${b.time}" onchange="updateBatchField(${idx}, 'time', this.value)"></td>
        <td><input type="number" step="0.01" value="${b.moisture}" onchange="updateBatchField(${idx}, 'moisture', parseFloat(this.value)||0)"></td>
        <td><input type="number" step="0.1" value="${b.partThrough}" onchange="updateBatchField(${idx}, 'partThrough', parseFloat(this.value)||0)"></td>
        <td><input type="number" step="0.1" value="${b.partRet}" onchange="updateBatchField(${idx}, 'partRet', parseFloat(this.value)||0)"></td>
        <td>
          <div style="display:flex;gap:2px;">
            <input type="number" step="0.01" value="${b.w1}" placeholder="#1" onchange="updateBatchField(${idx}, 'w1', parseFloat(this.value)||0)">
            <input type="number" step="0.01" value="${b.w2}" placeholder="#2" onchange="updateBatchField(${idx}, 'w2', parseFloat(this.value)||0)">
            <input type="number" step="0.01" value="${b.w3}" placeholder="#3" onchange="updateBatchField(${idx}, 'w3', parseFloat(this.value)||0)">
          </div>
        </td>
        <td>
          <div style="display:flex;gap:2px;">
            <input type="number" step="0.01" value="${b.w4}" placeholder="#4" onchange="updateBatchField(${idx}, 'w4', parseFloat(this.value)||0)">
            <input type="number" step="0.01" value="${b.w5}" placeholder="#5" onchange="updateBatchField(${idx}, 'w5', parseFloat(this.value)||0)">
          </div>
        </td>
        <td>
          <select onchange="updateBatchField(${idx}, 'packCheck', this.value)">
            <option value="ผ่าน" ${b.packCheck==='ผ่าน'?'selected':''}>ผ่าน</option>
            <option value="ไม่ผ่าน" ${b.packCheck==='ไม่ผ่าน'?'selected':''}>ไม่ผ่าน</option>
          </select>
        </td>
        <td>
          <select onchange="updateBatchField(${idx}, 'labelCheck', this.value)">
            <option value="ผ่าน" ${b.labelCheck==='ผ่าน'?'selected':''}>ผ่าน</option>
            <option value="ไม่ผ่าน" ${b.labelCheck==='ไม่ผ่าน'?'selected':''}>ไม่ผ่าน</option>
          </select>
        </td>
        <td>
          <button type="button" class="btn small danger" onclick="removeBatch(${idx})">ลบ</button>
        </td>
      </tr>
    `;
  }).join('');

  calcBatchSummary();
}

function updateBatchField(idx, field, val){
  if(currentBatches[idx]){
    currentBatches[idx][field] = val;
    calcBatchSummary();
  }
}

function removeBatch(idx){
  if(currentBatches.length <= 1){
    alert('ต้องมีอย่างน้อย 1 Batch สำหรับการวิเคราะห์');
    return;
  }
  currentBatches.splice(idx, 1);
  renderBatchTable();
}

function calcBatchSummary(){
  let totalBags = 0;
  let sumMoisture = 0;
  let sumThrough = 0;
  let sumRet = 0;
  let sumWeights = 0;
  let totalWeightsCount = 0;
  const count = currentBatches.length;

  currentBatches.forEach(function(b){
    totalBags += parseFloat(b.amount) || 0;
    sumMoisture += parseFloat(b.moisture) || 0;
    sumThrough += parseFloat(b.partThrough) || 0;
    sumRet += parseFloat(b.partRet) || 0;

    [b.w1, b.w2, b.w3, b.w4, b.w5].forEach(function(w){
      if(w){
        sumWeights += parseFloat(w);
        totalWeightsCount++;
      }
    });
  });

  const netSpec = parseFloat(document.getElementById('pkg-net-spec')?.value) || 25.00;
  const totalMT = ((totalBags * netSpec) / 1000).toFixed(3);
  const avgMoisture = count ? (sumMoisture / count).toFixed(2) : '0.00';
  const avgThrough = count ? (sumThrough / count).toFixed(2) : '0.00';
  const avgRet = count ? (sumRet / count).toFixed(2) : '0.00';
  const avgGross = totalWeightsCount ? (sumWeights / totalWeightsCount).toFixed(2) : '25.08';

  if(document.getElementById('sum-bags')) document.getElementById('sum-bags').textContent = totalBags;
  if(document.getElementById('sum-mt')) document.getElementById('sum-mt').textContent = totalMT;
  if(document.getElementById('avg-moisture')) document.getElementById('avg-moisture').textContent = avgMoisture;
  if(document.getElementById('avg-through')) document.getElementById('avg-through').textContent = avgThrough;
  if(document.getElementById('avg-ret')) document.getElementById('avg-ret').textContent = avgRet;
  if(document.getElementById('avg-gross')) document.getElementById('avg-gross').textContent = avgGross;

  return { totalBags, totalMT, avgMoisture, avgThrough, avgRet, avgGross, netSpec };
}

                <td style="border:1px solid #000;padding:3px;text-align:center;">${p.scale||'-'}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>

      <!-- หมายเหตุตามฟอร์มจริง -->
      <div style="font-size:13px;color:#222;line-height:1.25;margin-bottom:16px;">
        <b>หมายเหตุ:</b><br>
        1. น้ำหนักผลิตภัณฑ์รวมกับบรรจุภัณฑ์ชั้นใน, ขนาด 10 Kg (10.06 Kg), ขนาด 15 Kg (15.06 Kg), ขนาด 25 Kg (25.08 Kg), ขนาด 30 Kg (30.25Kg), ขนาด 40 Kg (40.18 Kg) และ Paper Bag Icing 25 Kg (25.30 Kg)<br>
        2. การตรวจสอบสภาพบรรจุภัณฑ์ สะอาดปราศจากสิ่งปนเปื้อน ไม่ฉีกขาด รอยเย็บเรียบร้อย ไม่เปียกชื้น ไม่มีรอยเปื้อน ความถูกต้องของชนิดบรรจุภัณฑ์ และสีด้ายเย็บ กรณีที่เป็นกล่องต้องไม่บุบหรือยุบตัว<br>
        3. การตรวจสอบรายละเอียดบนฉลาก ชื่อผลิตภัณฑ์ น้ำหนักสุทธิ วันเดือนปีที่ผลิตและหมดอายุของผลิตภัณฑ์<br>
        4. ระบุเครื่องหมาย ✓ หมายถึง ถูกต้อง ยอมรับ หรือเครื่องหมาย X หมายถึง ไม่ถูกต้อง ไม่ยอมรับ
      </div>

      <!-- ส่วนลงนามตามฟอร์มจริง -->
      <div style="display:flex;justify-content:space-between;font-size:15px;text-align:center;margin-top:16px;">
        <div style="width:45%;">
          ผู้ตรวจสอบ............................................................<br>
          ( ${item.rep || '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'} )<br>
          <span style="font-size:13px;">เจ้าหน้าที่/ผช.หัวหน้าฝ่ายประกันคุณภาพ</span>
        </div>
        <div style="width:45%;">
          ผู้ทวนสอบ............................................................<br>
          ( ${item.appr || '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'} )<br>
          <span style="font-size:13px;">หัวหน้าฝ่ายประกันคุณภาพ</span>
        </div>
      </div>

    </div>
  `;
  window.print();
}

render();
</script>
</body>
</html>

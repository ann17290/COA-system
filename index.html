<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดการ COA อัจฉริยะ - PGI Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE; --paper:#FFFFFF; --ink:#1B2A2E; --ink-soft:#5B6B6C;
  --teal:#2F6F6B; --teal-deep:#1F4B49; --amber:#C9862E; --danger:#B23A34; --ok:#3A7D5C;
  --line:#DCD8CC; --line-soft:#EAE7DC;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}
.shell{display:flex;min-height:100vh;}
nav.side{width:235px;flex:none;background:var(--teal-deep);color:#EAF3F1;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
nav.side .brand{font-weight:700;font-size:15px;margin-bottom:2px;}
nav.side .brand small{display:block;font-weight:400;font-size:11px;color:#A9C7C3;margin-top:3px;}
nav.side ul{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:3px;}
nav.side button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:13px;color:#CFE3E0;width:100%;box-sizing:border-box;}
nav.side button:hover{background:rgba(255,255,255,.08);}
nav.side button.active{background:#EAF3F1;color:var(--teal-deep);font-weight:700;}
main{flex:1;padding:24px 30px;max-width:1180px;}
h1.page{font-size:20px;margin:0 0 4px;font-weight:700;}
p.sub{margin:0 0 20px;color:var(--ink-soft);font-size:13.5px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.stat .n{font-size:24px;font-weight:700;line-height:1.1;}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px;}
.form-grid label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;font-weight:500;}
.form-grid input, .form-grid select{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
button.btn{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
button.primary:hover{background:var(--teal-deep);}
button.small{padding:5px 10px;font-size:12px;border-radius:5px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.badge.pass{background:#E3F2E9;color:var(--ok);}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:13px;}
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">COA MANAGEMENT<small>PGI Foods International</small></div>
    <ul id="navlist">
      <li><button type="button" data-tab="dash" class="active">📊 แดชบอร์ด</button></li>
      <li><button type="button" data-tab="qc-analysis">🔬 การวิเคราะห์คุณภาพ (FM-QA-24/19)</button></li>
      <li><button type="button" data-tab="list">📋 รายการ COA ทั้งหมด</button></li>
    </ul>
  </nav>
  <main>
    <section id="tab-dash"></section>
    <section id="tab-qc-analysis" style="display:none"></section>
    <section id="tab-list" style="display:none"></section>
  </main>
</div>
<div id="printArea"></div>

<script>
let activeTab = 'dash';

function getQCData(){
  try{
    const r = localStorage.getItem('pgi_qc_data_v1');
    if(r) return JSON.parse(r);
  }catch(e){}
  return [];
}

function saveQCData(data){
  try{
    localStorage.setItem('pgi_qc_data_v1', JSON.stringify(data));
  }catch(e){}
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('nav.side button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  document.querySelectorAll('main > section').forEach(function(s){
    s.style.display = 'none';
  });
  const target = document.getElementById('tab-' + tab);
  if(target){
    target.style.display = 'block';
  }
  render();
}

document.getElementById('navlist').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-tab]');
  if(btn){
    e.preventDefault();
    switchTab(btn.getAttribute('data-tab'));
  }
});

function render(){
  if(activeTab === 'dash') renderDash();
  if(activeTab === 'qc-analysis') renderQCAnalysis();
  if(activeTab === 'list') renderList();
}

function renderDash(){
  const list = getQCData();
  document.getElementById('tab-dash').innerHTML = `
    <h1 class="page">📊 ภาพรวมระบบจัดการ COA</h1>
    <p class="sub">สรุปสถานะการตรวจวิเคราะห์คุณภาพผลิตภัณฑ์และการออกใบรับรอง (COA)</p>
    <div class="grid-stats">
      <div class="stat"><div class="n">${list.length}</div><div class="l">รายการวิเคราะห์ทั้งหมด</div></div>
      <div class="stat"><div class="n">${list.length}</div><div class="l">ออก COA สำเร็จ</div></div>
    </div>
    <div class="card">
      <h3>เข้าสู่ระบบบันทึกคุณภาพ</h3>
      <p style="font-size:13px;color:var(--ink-soft)">บันทึกผลวิเคราะห์คุณภาพแล็บ FM-QA-24 และตรวจสอบการบรรจุ FM-QA-19 เพื่อนำไปออกใบ COA</p>
      <button type="button" class="btn primary" onclick="switchTab('qc-analysis')">🔬 ไปที่การวิเคราะห์คุณภาพ →</button>
    </div>
  `;
}

function renderQCAnalysis(){
  document.getElementById('tab-qc-analysis').innerHTML = `
    <h1 class="page">🔬 บันทึกการวิเคราะห์คุณภาพ (FM-QA-24 & FM-QA-19)</h1>
    <p class="sub">บันทึกผลวิเคราะห์ทางห้องแล็บและผลการตรวจบรรจุภัณฑ์ เพื่อออกใบ COA สำเร็จรูป</p>

    <div class="card">
      <h3 style="color:var(--teal)">1. ข้อมูลทั่วไปและการสั่งผลิต</h3>
      <div class="form-grid">
        <div><label>ชนิดผลิตภัณฑ์</label>
          <select id="qc-prod">
            <option value="Icing Sugar">Icing Sugar</option>
            <option value="Sugar Milled 40s">Sugar Milled 40s</option>
            <option value="Caster Sugar 30s">Caster Sugar 30s</option>
            <option value="Ground Sugar">Ground Sugar</option>
          </select>
        </div>
        <div><label>Lot No. ผลิตภัณฑ์</label><input id="qc-lot" placeholder="เช่น IC260801"></div>
        <div><label>ชื่อลูกค้า (Customer)</label><input id="qc-cust" placeholder="ระบุชื่อลูกค้า"></div>
        <div><label>วันที่ผลิต (MFG Date)</label><input id="qc-mfg" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div><label>วันที่หมดอายุ (EXP Date)</label><input id="qc-exp" type="date"></div>
        <div><label>กำหนดส่งมอบ (Delivery Date)</label><input id="qc-deliv" type="date"></div>
      </div>
    </div>

    <div class="card">
      <h3 style="color:var(--teal)">2. ผลการวิเคราะห์คุณภาพผลิตภัณฑ์สำเร็จรูป (FM-QA-24 Rev.01)</h3>
      <div class="form-grid">
        <div><label>Moisture Content (%)</label><input id="qa-moisture" type="number" step="0.01" value="0.04"></div>
        <div><label>Polarization (Degree °Z)</label><input id="qa-polar" type="number" step="0.01" value="99.80"></div>
        <div><label>Color (ICUMSA)</label><input id="qa-color" type="number" value="45"></div>
        <div><label>Invert Sugar (% w/w)</label><input id="qa-invert" type="number" step="0.001" value="0.02"></div>
        <div><label>Particle Size (% ผ่านตะแกรง 180µ)</label><input id="qa-part-pass" type="number" step="0.1" value="98.5"></div>
        <div><label>Particle Size (% ค้างบนตะแกรง 180µ)</label><input id="qa-part-ret" type="number" step="0.1" value="1.5"></div>
        <div><label>ลักษณะปรากฏ (Appearance)</label><input id="qa-app" value="White Powder"></div>
        <div><label>กลิ่น (Odor)</label><input id="qa-odor" value="No off odor"></div>
        <div><label>รสชาติ (Taste)</label><input id="qa-taste" value="Sweet"></div>
      </div>
      <div class="form-grid">
        <div><label>ผู้วิเคราะห์ (Report By)</label><input id="qa-rep" placeholder="เจ้าหน้าที่ QA"></div>
        <div><label>ผู้ทวนสอบ (Approved By)</label><input id="qa-appr" placeholder="หัวหน้าฝ่าย QA"></div>
      </div>
    </div>

    <div class="card">
      <h3 style="color:var(--teal)">3. รายงานการตรวจสอบการบรรจุผลิตภัณฑ์ (FM-QA-19 Rev.02)</h3>
      <div class="form-grid">
        <div><label>น้ำหนักสุทธิต่อถุง (Net Wt. Kg)</label><input id="qa-net" type="number" step="0.01" value="25.00"></div>
        <div><label>จำนวนที่ผลิตได้ (Bags)</label><input id="qa-bags" type="number" value="200"></div>
        <div><label>ปริมาณรวมสุทธิ (MT)</label><input id="qa-mt" type="number" step="0.001" value="5.000" readonly style="background:var(--line-soft)"></div>
      </div>
      <div style="text-align:right;margin-top:14px;">
        <button type="button" class="btn primary" id="btn-save-qc">💾 บันทึกผลวิเคราะห์ & ออกใบ COA →</button>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead>
          <tr><th>Lot No.</th><th>สินค้า</th><th>ลูกค้า</th><th>วันที่ผลิต</th><th>Moisture</th><th>จำนวนบรรจุ</th><th>การจัดการ</th></tr>
        </thead>
        <tbody id="qc-table-body"></tbody>
      </table>
    </div>
  `;

  const calcMT = function(){
    const net = parseFloat(document.getElementById('qa-net').value) || 0;
    const bags = parseFloat(document.getElementById('qa-bags').value) || 0;
    document.getElementById('qa-mt').value = ((net * bags)/1000).toFixed(3);
  };
  document.getElementById('qa-net').addEventListener('input', calcMT);
  document.getElementById('qa-bags').addEventListener('input', calcMT);

  document.getElementById('btn-save-qc').addEventListener('click', saveRecord);
  renderQCTable();
}

function saveRecord(){
  const lot = document.getElementById('qc-lot').value.trim();
  if(!lot){
    alert('กรุณาระบุ Lot No. ผลิตภัณฑ์');
    return;
  }

  const item = {
    lot: lot,
    prod: document.getElementById('qc-prod').value,
    cust: document.getElementById('qc-cust').value,
    mfg: document.getElementById('qc-mfg').value,
    exp: document.getElementById('qc-exp').value,
    deliv: document.getElementById('qc-deliv').value,
    moisture: document.getElementById('qa-moisture').value,
    polar: document.getElementById('qa-polar').value,
    color: document.getElementById('qa-color').value,
    invert: document.getElementById('qa-invert').value,
    partPass: document.getElementById('qa-part-pass').value,
    partRet: document.getElementById('qa-part-ret').value,
    app: document.getElementById('qa-app').value,
    odor: document.getElementById('qa-odor').value,
    taste: document.getElementById('qa-taste').value,
    rep: document.getElementById('qa-rep').value,
    appr: document.getElementById('qa-appr').value,
    net: document.getElementById('qa-net').value,
    bags: document.getElementById('qa-bags').value,
    mt: document.getElementById('qa-mt').value,
    date: new Date().toISOString().slice(0,10)
  };

  const list = getQCData();
  list.unshift(item);
  saveQCData(list);
  alert('บันทึกข้อมูลและออกใบ COA เรียบร้อยแล้ว!');
  renderQCTable();
}

function renderQCTable(){
  const list = getQCData();
  const tbody = document.getElementById('qc-table-body');
  if(!tbody) return;
  if(list.length === 0){
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty">ยังไม่มีข้อมูลการวิเคราะห์</div></td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(item, idx){
    return `
      <tr>
        <td class="mono"><b>${item.lot}</b></td>
        <td>${item.prod}</td>
        <td>${item.cust || '-'}</td>
        <td>${item.mfg}</td>
        <td>${item.moisture}%</td>
        <td>${item.bags} ถุง (${item.mt} MT)</td>
        <td><button type="button" class="btn small primary" onclick="printCOA(${idx})">🖨️ พิมพ์ COA</button></td>
      </tr>
    `;
  }).join('');
}

function renderList(){
  const list = getQCData();
  document.getElementById('tab-list').innerHTML = `
    <h1 class="page">📋 รายการ COA ทั้งหมด</h1>
    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead>
          <tr><th>Lot No.</th><th>สินค้า</th><th>ลูกค้า</th><th>วันที่ออกผล</th><th>ปริมาณ (MT)</th><th>พิมพ์ COA</th></tr>
        </thead>
        <tbody>
          ${list.map(function(item, idx){
            return `
              <tr>
                <td class="mono"><b>${item.lot}</b></td>
                <td>${item.prod}</td>
                <td>${item.cust || '-'}</td>
                <td>${item.date}</td>
                <td>${item.mt} MT</td>
                <td><button type="button" class="btn small primary" onclick="printCOA(${idx})">🖨️ พิมพ์ COA</button></td>
              </tr>
            `;
          }).join('') || '<tr><td colspan="6"><div class="empty">ยังไม่มีรายการ COA</div></td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function printCOA(index){
  const item = getQCData()[index];
  if(!item) return;
  document.getElementById('printArea').innerHTML = `
    <div style="font-family:'IBM Plex Sans Thai',sans-serif;max-width:760px;margin:0 auto;padding:20px;color:#111;">
      <div style="text-align:center;">
        <div style="font-weight:700;font-size:16px;">บริษัท พีจีไอ ฟู้ดส์ อินเตอร์เนชั่นแนล จำกัด</div>
        <div style="font-weight:600;font-size:14px;">PGI FOODS INTERNATIONAL COMPANY LIMITED</div>
        <div style="font-size:11px;color:#556B6C;">16/1 ซอยบางกระดี่ 23 แขวงแสมดำ เขตบางขุนเทียน กรุงเทพ 10150</div>
      </div>
      <div style="text-align:right;font-size:11px;margin-top:6px;">FM-QA-25 Rev.01, 01/07/2025</div>
      <div style="text-align:center;font-weight:700;font-size:18px;margin:14px 0 2px;">Certificate Of Analysis</div>
      <div style="text-align:center;font-weight:600;font-size:15px;margin-bottom:12px;">${item.prod}</div>
      
      <table style="width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px;border:1px solid #333;">
        <tr>
          <td style="padding:5px;border:1px solid #333;width:50%;"><b>Producer Information</b></td>
          <td style="padding:5px;border:1px solid #333;width:50%;"><b>Customer Information</b></td>
        </tr>
        <tr>
          <td style="padding:4px;border:1px solid #333;">Quantity: ${item.mt} MT</td>
          <td style="padding:4px;border:1px solid #333;">Customer: ${item.cust || '-'}</td>
        </tr>
        <tr>
          <td style="padding:4px;border:1px solid #333;">Production Date: ${item.mfg}</td>
          <td style="padding:4px;border:1px solid #333;">Delivery Date: ${item.deliv || '-'}</td>
        </tr>
        <tr>
          <td style="padding:4px;border:1px solid #333;">Expire Date: ${item.exp || '-'}</td>
          <td style="padding:4px;border:1px solid #333;">Net Weight: ${item.net} Kg/bag</td>
        </tr>
        <tr>
          <td style="padding:4px;border:1px solid #333;">Lot No.: ${item.lot}</td>
          <td style="padding:4px;border:1px solid #333;">Amount: ${item.bags} Bags</td>
        </tr>
      </table>

      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px;">
        <thead>
          <tr style="background:#f2f2f2;">
            <th style="border:1px solid #333;padding:6px;">Item</th>
            <th style="border:1px solid #333;padding:6px;">Analysis Result</th>
            <th style="border:1px solid #333;padding:6px;">Unit</th>
          </tr>
        </thead>
        <tbody>
          <tr><td style="border:1px solid #333;padding:5px;">Appearance</td><td style="border:1px solid #333;padding:5px;">${item.app}</td><td style="border:1px solid #333;padding:5px;">-</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Odor</td><td style="border:1px solid #333;padding:5px;">${item.odor}</td><td style="border:1px solid #333;padding:5px;">-</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Taste</td><td style="border:1px solid #333;padding:5px;">${item.taste}</td><td style="border:1px solid #333;padding:5px;">-</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Moisture</td><td style="border:1px solid #333;padding:5px;">${item.moisture}</td><td style="border:1px solid #333;padding:5px;">%</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Polarization</td><td style="border:1px solid #333;padding:5px;">${item.polar}</td><td style="border:1px solid #333;padding:5px;">Degree °Z</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Color</td><td style="border:1px solid #333;padding:5px;">${item.color}</td><td style="border:1px solid #333;padding:5px;">Icumsa</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Invert Sugar</td><td style="border:1px solid #333;padding:5px;">${item.invert}</td><td style="border:1px solid #333;padding:5px;">% w/w</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Particle Size (Through 180µ)</td><td style="border:1px solid #333;padding:5px;">${item.partPass}</td><td style="border:1px solid #333;padding:5px;">%</td></tr>
          <tr><td style="border:1px solid #333;padding:5px;">Particle Size (Retained 180µ)</td><td style="border:1px solid #333;padding:5px;">${item.partRet}</td><td style="border:1px solid #333;padding:5px;">%</td></tr>
        </tbody>
      </table>

      <div style="display:flex;justify-content:space-between;margin-top:35px;font-size:12px;text-align:center;">
        <div style="width:45%;">
          Report By........................................<br>
          (${item.rep || '________________________'})
        </div>
        <div style="width:45%;">
          Approved By........................................<br>
          (${item.appr || '________________________'})
        </div>
      </div>
    </div>
  `;
  window.print();
}

render();
</script>
</body>
</html>

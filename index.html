<head>

<style>
:root{
  --bg:#F6F4EE; --paper:#FFFFFF; --ink:#1B2A2E; --ink-soft:#5B6B6C;
  --teal:#2F6F6B; --teal-deep:#1F4B49; --amber:#C9862E; --danger:#B23A34; --ok:#3A7D5C;
  --line:#DCD8CC; --line-soft:#EAE7DC;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Angsana New', 'Sarabun', 'TH Sarabun New', sans-serif;
  font-size:16px;
  line-height:1.25;
  min-height:100vh;
}
.mono{font-family:'Angsana New', 'Sarabun', monospace;}
.shell{display:flex;min-height:100vh;}
nav.side{width:260px;flex:none;background:var(--teal-deep);color:#EAF3F1;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
nav.side .brand{font-weight:700;font-size:18px;margin-bottom:2px;}
nav.side .brand small{display:block;font-weight:400;font-size:13px;color:#A9C7C3;margin-top:2px;}
nav.side ul{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:3px;}
nav.side button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:15px;color:#CFE3E0;width:100%;box-sizing:border-box;}
nav.side button:hover{background:rgba(255,255,255,.08);}
nav.side button.active{background:#EAF3F1;color:var(--teal-deep);font-weight:700;}
main{flex:1;padding:20px 28px;max-width:1280px;}
h1.page{font-size:24px;margin:0 0 4px;font-weight:700;}
p.sub{margin:0 0 18px;color:var(--ink-soft);font-size:15px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.card h3{margin:0 0 10px;font-size:17px;font-weight:700;}
.sub-box{background:#FAF9F5;border:1px dashed var(--line);border-radius:8px;padding:12px;margin-bottom:12px;position:relative;}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px;}
.stat .n{font-size:28px;font-weight:700;line-height:1.1;}
.stat .l{font-size:14px;color:var(--ink-soft);margin-top:2px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-bottom:12px;}
.form-grid label{font-size:14px;color:var(--ink-soft);display:block;margin-bottom:2px;font-weight:600;}
.form-grid input, .form-grid select{width:100%;font-family:inherit;font-size:15px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
button.btn{font-family:inherit;font-size:15px;padding:6px 14px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
button.primary:hover{background:var(--teal-deep);}
button.small{padding:3px 8px;font-size:14px;border-radius:5px;}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
button.ghost{background:transparent;border:1px solid var(--line-soft);}
table{width:100%;border-collapse:collapse;font-size:15px;}
th{text-align:center;color:var(--ink-soft);font-weight:700;font-size:14px;padding:6px 4px;border-bottom:1px solid var(--line);background:var(--line-soft);}
td{padding:5px 4px;border-bottom:1px solid var(--line-soft);text-align:center;}
td input, td select{font-family:inherit;font-size:14px;padding:4px 5px;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box;text-align:center;}
.summary-bar{background:var(--line-soft);padding:8px 14px;border-radius:8px;font-size:15px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:15px;}

/* Tabs Master data */
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.sub-tabs button{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-family:inherit;}
.sub-tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700;}

/* Modal แก้ไข Master Data */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;}
.modal-box{background:var(--paper);padding:20px;border-radius:10px;max-width:500px;width:90%;box-shadow:0 10px 25px rgba(0,0,0,0.2);}

/* พิมพ์เอกสาร */
#printArea{display:none;}
.print-container{
  font-family:'Angsana New', 'Sarabun', 'TH Sarabun New', sans-serif !important;
  max-width:760px;
  margin:0 auto;
  padding:20px;
  color:#000;
  line-height:1.2;
}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>

function getMasterData(){
  try{

}

function formatDMY(date){
  if(!date || isNaN(date.getTime())) return '';
  const d = String(date.getDate()).padStart(2, '0');
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const y = date.getFullYear();
  return `${d}/${m}/${y}`;
}

function parseDMY(str){
  if(!str) return null;
  const parts = str.trim().split('/');
  if(parts.length !== 3) return null;
  const d = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10) - 1;
  const y = parseInt(parts[2], 10);
  const dt = new Date(y, m, d);
  return isNaN(dt.getTime()) ? null : dt;
}

function getTodayDMY(){
  return formatDMY(new Date());
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('nav.side button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  document.querySelectorAll('main > section').forEach(function(s){
    s.style.display = 'none';
  });
  const target = document.getElementById('tab-' + tab);
  if(target){
    target.style.display = 'block';
  }
  render();
}

document.getElementById('navlist').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-tab]');
  if(btn){
    e.preventDefault();
    switchTab(btn.getAttribute('data-tab'));
  }
});

}

function calculateExpDate(){
  const mfgInput = document.getElementById('qc-mfg');
  const expInput = document.getElementById('qc-exp');
  const prodSelect = document.getElementById('qc-prod');
  const custSelect = document.getElementById('qc-cust-select');

  if(!mfgInput || !mfgInput.value) return;
  const mfg = parseDMY(mfgInput.value);
  if(!mfg) return;

  const master = getMasterData();
  const matchedProd = master.products.find(p => p.name === prodSelect?.value);
  const matchedCust = master.customers.find(c => c.name === custSelect?.value);

  let exp = new Date(mfg);

  if(matchedCust && matchedCust.shelfLifeYears === 2){
    exp.setFullYear(exp.getFullYear() + 2);
  } else if(matchedProd && matchedProd.shelfMonths){
    exp.setMonth(exp.getMonth() + matchedProd.shelfMonths);
  } else {
    exp.setFullYear(exp.getFullYear() + 1);
  }

  expInput.value = formatDMY(exp);
}

        <div>

          <input id="qc-exp" placeholder="dd/mm/yyyy">
        </div>

function calcBatchSummary(){
  let totalBags = 0;
  let sumMoisture = 0;
  let sumThrough = 0;
  let sumRet = 0;
  let sumWeights = 0;
  let totalWeightsCount = 0;
  const count = currentBatches.length;

  currentBatches.forEach(function(b){
    totalBags += parseFloat(b.amount) || 0;
    sumMoisture += parseFloat(b.moisture) || 0;
    sumThrough += parseFloat(b.partThrough) || 0;
    sumRet += parseFloat(b.partRet) || 0;

    [b.w1, b.w2, b.w3, b.w4, b.w5].forEach(function(w){
      if(w){
        sumWeights += parseFloat(w);
        totalWeightsCount++;
      }
    });
  });

  const netSpec = parseFloat(document.getElementById('pkg-net-spec')?.value) || 25.00;
  const totalMT = ((totalBags * netSpec) / 1000).toFixed(3);
  const avgMoisture = count ? (sumMoisture / count).toFixed(2) : '0.00';
  const avgThrough = count ? (sumThrough / count).toFixed(2) : '0.00';
  const avgRet = count ? (sumRet / count).toFixed(2) : '0.00';
  const avgGross = totalWeightsCount ? (sumWeights / totalWeightsCount).toFixed(2) : '25.08';

  if(document.getElementById('sum-bags')) document.getElementById('sum-bags').textContent = totalBags;
  if(document.getElementById('sum-mt')) document.getElementById('sum-mt').textContent = totalMT;
  if(document.getElementById('avg-moisture')) document.getElementById('avg-moisture').textContent = avgMoisture;
  if(document.getElementById('avg-through')) document.getElementById('avg-through').textContent = avgThrough;
  if(document.getElementById('avg-ret')) document.getElementById('avg-ret').textContent = avgRet;
  if(document.getElementById('avg-gross')) document.getElementById('avg-gross').textContent = avgGross;

  return { totalBags, totalMT, avgMoisture, avgThrough, avgRet, avgGross, netSpec };
}

function toggleStaffApproval(pos){
  const el = document.getElementById('add-staff-canappr');
  if(!el) return;
  const isAppr = (pos === 'ผู้ช่วยหัวหน้าฝ่าย QA' || pos === 'หัวหน้าฝ่าย QA');
  el.value = isAppr ? '✓ มีสิทธิ์อนุมัติ' : 'ไม่มีสิทธิ์อนุมัติ';
}

function addCustomerMaster(){
  const code = document.getElementById('add-cust-code').value.trim();
  const name = document.getElementById('add-cust-name').value.trim();
  const shelfLifeYears = parseInt(document.getElementById('add-cust-life').value, 10) || 1;
  if(!code || !name) return alert('กรุณากรอกรหัสและชื่อลูกค้า');
  const master = getMasterData();
  master.customers.push({ code, name, shelfLifeYears });
  saveMasterData(master);
  renderMasterSubTab();
}

function addProductMaster(){
  const code = document.getElementById('add-prod-code').value.trim();
  const name = document.getElementById('add-prod-name').value.trim();
  const shelfMonths = parseInt(document.getElementById('add-prod-months').value, 10) || 12;
  if(!code || !name) return alert('กรุณากรอกรหัสและชื่อผลิตภัณฑ์');
  const master = getMasterData();
  master.products.push({ code, name, shelfMonths });
  saveMasterData(master);
  renderMasterSubTab();
}

function addMaterialMaster(){
  const code = document.getElementById('add-mat-code').value.trim();
  const name = document.getElementById('add-mat-name').value.trim();
  const type = document.getElementById('add-mat-type').value;
  if(!code || !name) return alert('กรุณากรอกรหัสและชื่อวัตถุดิบ');
  const master = getMasterData();
  master.materials.push({ code, name, type });
  saveMasterData(master);
  renderMasterSubTab();
}

function addPackagingMaster(){
  const name = document.getElementById('add-pkg-name').value.trim();
  const inner = document.getElementById('add-pkg-inner').value.trim();
  const outer = document.getElementById('add-pkg-outer').value.trim();
  const netSpec = parseFloat(document.getElementById('add-pkg-net').value) || 25.00;

function addStaffMaster(){
  const id = document.getElementById('add-staff-id').value.trim();
  const name = document.getElementById('add-staff-name').value.trim();
  const position = document.getElementById('add-staff-pos').value;

function deleteMasterItem(key, idx){
  const master = getMasterData();
  if(master[key] && master[key].length > 1){
    if(confirm('ต้องการลบรายการนี้ใช่หรือไม่?')){
      master[key].splice(idx, 1);
      saveMasterData(master);
      renderMasterSubTab();
    }
  } else {
    alert('ต้องมีข้อมูลอย่างน้อย 1 รายการ');
  }
}

function closeEditModal(){
  document.getElementById('modalArea').innerHTML = '';

function saveEditModal(key, idx){
  const master = getMasterData();
  if(key === 'customers'){
    master.customers[idx].code = document.getElementById('edit-c-code').value.trim();
    master.customers[idx].name = document.getElementById('edit-c-name').value.trim();
    master.customers[idx].shelfLifeYears = parseInt(document.getElementById('edit-c-life').value, 10);
  } else if(key === 'products'){
    master.products[idx].code = document.getElementById('edit-p-code').value.trim();
    master.products[idx].name = document.getElementById('edit-p-name').value.trim();
    master.products[idx].shelfMonths = parseInt(document.getElementById('edit-p-m').value, 10);
  } else if(key === 'materials'){
    master.materials[idx].code = document.getElementById('edit-m-code').value.trim();
    master.materials[idx].name = document.getElementById('edit-m-name').value.trim();
    master.materials[idx].type = document.getElementById('edit-m-type').value;
  } else if(key === 'packagings'){
    master.packagings[idx].name = document.getElementById('edit-pkg-name').value.trim();
    master.packagings[idx].inner = document.getElementById('edit-pkg-inner').value.trim();
    master.packagings[idx].outer = document.getElementById('edit-pkg-outer').value.trim();
    master.packagings[idx].netSpec = parseFloat(document.getElementById('edit-pkg-net').value) || 25.00;
    master.packagings[idx].grossSpec = document.getElementById('edit-pkg-gross').value.trim();
    master.packagings[idx].thread = document.getElementById('edit-pkg-thread').value.trim();
  } else if(key === 'staffs'){
    const pos = document.getElementById('edit-st-pos').value;
    master.staffs[idx].id = document.getElementById('edit-st-id').value.trim();
    master.staffs[idx].name = document.getElementById('edit-st-name').value.trim();
    master.staffs[idx].position = pos;
    master.staffs[idx].canApprove = (pos === 'ผู้ช่วยหัวหน้าฝ่าย QA' || pos === 'หัวหน้าฝ่าย QA');
  }

  saveMasterData(master);
  closeEditModal();
  renderMasterSubTab();
}

        3. การตรวจสอบรายละเอียดบนฉลาก ชื่อผลิตภัณฑ์ น้ำหนักสุทธิ วันเดือนปีที่ผลิตและหมดอายุของผลิตภัณฑ์<br>
        4. ระบุเครื่องหมาย [✓] หมายถึง ถูกต้อง ยอมรับ หรือเครื่องหมาย [X] หมายถึง ไม่ถูกต้อง ไม่ยอมรับ
